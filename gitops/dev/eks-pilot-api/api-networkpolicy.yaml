apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eks-pilot-api-ingress
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: eks-pilot-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev
      ports:
        - protocol: TCP
          port: 3000
