name: Build, Push and Deploy to EKS

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-and-push.yml'

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: eks-pilot-api
  ECR_REGISTRY: 750281913869.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::750281913869:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}

  update-gitops-manifest:
    name: Update GitOps Image Tag
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Update Kustomize image tag
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          python3 <<'PYTHON'
          import os
          from pathlib import Path

          path = Path("gitops/dev/eks-pilot-api/kustomization.yaml")
          content = path.read_text()

          lines = content.splitlines()
          matches = [i for i, line in enumerate(lines)
                     if line.strip().startswith("newTag:")]

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one newTag entry, found {len(matches)}"
              )

          index = matches[0]
          lines[index] = "    newTag: " + os.environ["IMAGE_TAG"]
          path.write_text("\n".join(lines) + "\n")

          print(f"Updated image tag to: {os.environ['IMAGE_TAG']}")
          PYTHON

      - name: Review GitOps manifest change
        run: |
          git diff --check
          git diff -- gitops/dev/eks-pilot-api/kustomization.yaml

      - name: Commit and push GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- gitops/dev/eks-pilot-api/kustomization.yaml; then
            echo "No GitOps manifest change detected."
            exit 0
          fi

          git add gitops/dev/eks-pilot-api/kustomization.yaml
          git commit -m "chore(gitops): update API image to ${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:main
