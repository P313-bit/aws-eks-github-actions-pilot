name: Build, Push and Deploy to EKS

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-and-push.yml'

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: eks-pilot-api
  ECR_REGISTRY: 750281913869.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::750281913869:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}

  deploy-to-eks:
    name: Deploy Application to Amazon EKS
    runs-on: [self-hosted, linux, x64, eks-deploy]
    needs: build-and-push
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::750281913869:role/GitHubActionsEKSDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name devops-pilot-eks

      - name: Deploy new image to Kubernetes
        run: |
          kubectl set image deployment/eks-pilot-api \
            api=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT} \
            --namespace dev

      - name: Verify Kubernetes rollout
        run: |
          kubectl rollout status deployment/eks-pilot-api \
            --namespace dev \
            --timeout=180s

      - name: Display deployment status
        run: |
          kubectl get deployment eks-pilot-api -n dev
          kubectl get pods -n dev -o wide
