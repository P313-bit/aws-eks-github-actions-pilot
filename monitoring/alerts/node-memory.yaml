apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-memory-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: node-memory.rules
      interval: 30s
      rules:
        - alert: HighNodeMemoryUsage
          expr: |
            100 * (
              1 - node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes
            ) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on Kubernetes node"
            description: "Node {{ $labels.instance }} memory utilization is above 80% for more than 5 minutes."
